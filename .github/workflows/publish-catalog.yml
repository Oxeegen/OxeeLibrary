name: Publish the catalog

# Every merge into main: build catalog.json from that commit and publish it alone on the `catalog`
# branch, where Oxee Hermes reads it:
#   https://raw.githubusercontent.com/Oxeegen/OxeeLibrary/catalog/catalog.json
# (raw.githubusercontent.com answers the app's cross-origin fetch; a release download does not).
# The branch holds one commit, replaced each time. The catalog names the main commit it was built
# from, so the app shows every item at that exact commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish catalog.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the checker's dependencies
        run: pip install -r scripts/requirements.txt
      - name: Build catalog.json
        run: python scripts/build_catalog.py --out catalog.json --commit "$GITHUB_SHA"
      - name: Remove the former catalog release (a tag named like the branch would make it ambiguous)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view catalog >/dev/null 2>&1; then gh release delete catalog --cleanup-tag --yes; fi
      - name: Publish it on the catalog branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published && cp catalog.json published/ && cd published
          git init -q -b catalog && git add catalog.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Catalog built from $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/catalog
