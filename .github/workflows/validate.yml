name: Validate the library

# Every pull request and every push to main: each item is complete and clean, and catalog.json is
# the one the tree builds. Branch protection requires this check before a merge into main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate items and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the checker's dependencies
        run: pip install -r scripts/requirements.txt
      - name: Test the checker
        run: python -m pytest -q tests
      - name: Validate items and catalog.json
        run: python scripts/build_catalog.py --check
